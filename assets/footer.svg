<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 64" role="img" aria-label="press start">
  <rect width="1100" height="64" rx="10" fill="#07090d" stroke="#1c2a30"/>
  <text class="press" x="550" y="40" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#c6ff4a" letter-spacing="6">PRESS START TO FORK</text>
  <style>
    .press { animation: pulse 1.6s steps(1, end) infinite; }
    @keyframes pulse {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.2; }
    }
  </style>
</svg>
